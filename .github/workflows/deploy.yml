name: Deploy SolarPulse backend

# Frontend deploys are handled by AWS Amplify Hosting (connected to this repo).
# This workflow validates the frontend build and deploys the SAM backend stack.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC to AWS, no long-lived keys
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build

  backend-deploy:
    name: Deploy SAM stack
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Validate template
        run: sam validate --lint
      - name: Build
        run: sam build
      - name: Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AllowedOrigin="${{ vars.ALLOWED_ORIGIN || '*' }}" \
              IpHashSalt="${{ secrets.IP_HASH_SALT }}"
      - name: Show API endpoint
        run: |
          aws cloudformation describe-stacks \
            --stack-name solarpulse-by-qashfin \
            --query "Stacks[0].Outputs[?OutputKey=='AuditEndpoint'].OutputValue" \
            --output text
